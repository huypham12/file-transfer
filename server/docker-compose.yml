version: '3.8'

services:
  relay_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filetransfer-relay-backend
    restart: unless-stopped
    environment:
      - PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Phân bổ tài nguyên giới hạn
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  nginx_proxy:
    image: nginx:alpine
    container_name: filetransfer-relay-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relay_backend

