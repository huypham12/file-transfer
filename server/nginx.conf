events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Tối ưu hóa hiệu năng socket
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    # Máy chủ Reverse Proxy bọc SSL cho filetransfer Relay
    server {
        listen 443 ssl http2;
        server_name relay.filetransfer.internal;

        # Cấu hình chứng chỉ bảo mật TLS 1.3
        ssl_certificate     /etc/ssl/certs/relay.crt;
        ssl_certificate_key /etc/ssl/private/relay.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Cấu hình chuyển tiếp WebSocket cho kênh /v1/stream
        location /v1/stream {
            proxy_pass http://relay_backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Thời gian timeout lớn cho các tệp dung lượng lớn
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Tắt hoàn toàn bộ đệm proxy để chuyển tiếp tức thì (Zero-buffering)
            proxy_buffering off;
        }

        # Cấu hình kiểm tra sức khỏe hệ thống
        location /health {
            proxy_pass http://relay_backend:8080/health;
            proxy_http_version 1.1;
        }
    }
}

